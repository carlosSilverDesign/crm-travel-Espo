services:
  mysql:
    image: mysql:8.0
    container_name: crm_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: espocrm_db
      MYSQL_USER: espocrm_user
      MYSQL_PASSWORD: espocrm_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - travel_network

  espocrm:
    image: espocrm/espocrm
    container_name: crm_app
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: mysql
      ESPOCRM_DATABASE_USER: espocrm_user
      ESPOCRM_DATABASE_PASSWORD: espocrm_password
      ESPOCRM_DATABASE_NAME: espocrm_db
      ESPOCRM_SITE_URL: "http://localhost:8080"
    ports:
      - "8080:80"
    volumes:
      - ./custom:/var/www/html/custom
    depends_on:
      - mysql
    restart: always
    networks:
      - travel_network

  pdf-service:
    build:
      context: ./docker/pdf-service
      dockerfile: Dockerfile
    container_name: crm_pdf_service
    environment:
      PORT: 3000
      PDF_SERVICE_SECRET: ${PDF_SERVICE_SECRET:-travel_pdf_secret_2026}
    ports:
      - "3000:3000"
    restart: always
    networks:
      - travel_network

  travel-web:
    build:
      context: ./docker/travel-web
      dockerfile: Dockerfile
    container_name: crm_travel_web
    environment:
      PORT: 8080
    ports:
      - "8085:8080"
    restart: always
    networks:
      - travel_network

volumes:
  mysql_data:

networks:
  travel_network:
    name: travel_network
    external: true
